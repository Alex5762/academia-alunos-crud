name: CI - Academia Alunos CRUD

on:
  push:
    branches:
      - main
      - feat/dashboard-portfolio
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-and-mysql:
    name: PHP syntax and CRUD integration
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: academia_alunos
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Check required project files
        run: |
          test -f index.php
          test -f cadastro.php
          test -f salvar.php
          test -f excluir.php
          test -f conexao.php
          test -f banco.sql
          test -f style.css
          test -f tests/integration-crud.sh

      - name: Import database schema
        env:
          MYSQL_PWD: root
        run: mysql --host=127.0.0.1 --port=3306 --user=root < banco.sql

      - name: Run application and test real CRUD endpoints
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: academia_alunos
          DB_USER: root
          DB_PASSWORD: root
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/academia-php-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8080/cadastro.php >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8080/cadastro.php >/dev/null
          bash tests/integration-crud.sh
